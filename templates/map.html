<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이음 - 지도</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/map.css') }}"
    />
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_key }}&libraries=clusterer"></script>
  </head>
  <body class="bg-gray-100">
    <div class="w-full bg-white shadow-lg min-h-screen">
      <!-- 메인 컨텐츠: 지도 -->
      <main
        class="bg-white"
        style="height: calc(100vh - 65px); position: relative"
      >
        <!-- 검색바 및 필터 영역 -->
        <div
          class="absolute top-4 left-1/2 transform -translate-x-1/2 z-10 flex flex-col items-center gap-3 w-11/12 max-w-md"
        >
          <!-- 검색바 -->
          <div
            class="w-full bg-white rounded-full shadow-lg px-4 py-3 flex items-center gap-2"
          >
            <svg
              class="w-5 h-5 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="공고 검색..."
              class="flex-1 outline-none text-sm"
            />
          </div>

          <!-- 필터 버튼 -->
          <div class="flex justify-between gap-2 w-full">
            <button
              id="filterAll"
              class="filter-btn active flex-1 py-2 rounded-full font-bold text-xs sm:text-sm shadow-lg transition-all whitespace-nowrap"
              onclick="filterJobs('all')"
            >
              전체
            </button>
            <button
              id="filterCompany"
              class="filter-btn flex-1 py-2 rounded-full font-bold text-xs sm:text-sm shadow-lg transition-all whitespace-nowrap"
              onclick="filterJobs('company')"
            >
              기업 이음
            </button>
            <button
              id="filterPeople"
              class="filter-btn flex-1 py-2 rounded-full font-bold text-xs sm:text-sm shadow-lg transition-all whitespace-nowrap"
              onclick="filterJobs('people')"
            >
              사람 이음
            </button>
          </div>
        </div>

        <div id="map" aria-label="일자리 지도"></div>

        <!-- 하단 공고 목록 패널 -->
        <div id="jobListPanel" class="job-list-panel">
          <!-- 드래그 핸들 -->
          <div class="drag-handle">
            <div class="drag-bar"></div>
          </div>

          <!-- 공고 개수 표시 -->
          <div class="px-4 py-3 border-b">
            <h3 class="font-bold text-lg">
              이 지역의 공고
              <span id="jobCount" class="text-blue-600">0</span>개
            </h3>
          </div>

          <!-- 공고 목록 -->
          <div id="jobList" class="job-list-content">
            <!-- 공고 카드들이 여기에 동적으로 추가됩니다 -->
          </div>
        </div>
      </main>

      <!-- 하단 네비게이션 -->
      {% include 'components/footer.html' %}
    </div>

    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  </body>
</html>

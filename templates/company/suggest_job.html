<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공고 제안하기 - 이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="max-w-md mx-auto bg-white min-h-screen">
      <header class="bg-white p-4 border-b">
        <div class="relative flex items-center justify-center">
          <a href="{{ url_for('company.resume_list') }}" class="absolute left-0">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-gray-800"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </a>
          <h1 class="text-lg font-bold text-gray-800">공고 제안하기</h1>
        </div>
      </header>

      <main class="p-6">
        <p class="text-gray-700 text-center mb-6">
          <span class="font-bold text-blue-600">{{ resume.user.name }}</span>
          님에게 제안할 공고를 선택해주세요.
        </p>

        <div class="space-y-3">
          {% if jobs_for_suggestion %}
          {% for item in jobs_for_suggestion %}
          <div class="flex items-center p-4 border border-gray-200 rounded-lg">
            <div class="flex-1">
              <p class="font-semibold text-gray-800">{{ item.job.title }}</p>
              <p class="text-sm text-gray-500 mt-0.5">{{ item.job.company }}</p>
            </div>

            <div class="ml-4">
              {% if item.status == 'sent' %}
              <button
                      class="bg-gray-200 text-gray-500 font-bold py-2 px-4 rounded-lg text-sm cursor-not-allowed"
                      disabled
              >
                응답 대기 중
              </button>
              {% else %}
              <form action="{{ url_for('company.suggest_job', resume_id=resume.id) }}" method="POST" class="m-0">
                <input type="hidden" name="job_ids" value="{{ item.job.id }}">
                <button
                        type="submit"
                        class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg text-sm hover:bg-blue-700 transition-colors"
                >
                  제안하기
                </button>
              </form>
              {% endif %}
            </div>
          </div>
          {% endfor %}
          {% else %}
          <div class="text-center text-gray-500 py-16">
            <p>제안할 수 있는 공고가 없습니다.</p>
            <a
                    href="{{ url_for('jobs.create_company_job') }}"
                    class="mt-4 inline-block text-blue-600 font-semibold"
            >
              공고 등록하러 가기 &rarr;
            </a>
          </div>
          {% endif %}
        </div>

        <div class="mt-8">
          <a
                  href="{{ url_for('company.resume_list') }}"
                  class="block w-full text-center text-gray-600 font-medium py-3 rounded-lg hover:bg-gray-200 transition-colors"
          >
            취소
          </a>
        </div>
      </main>
    </div>
  </body>
</html>

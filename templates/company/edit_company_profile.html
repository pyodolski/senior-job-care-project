<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기업 프로필 수정 - 이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="w-full bg-white shadow-lg min-h-screen pb-20">
      <!-- 상단 헤더 -->
      <div class="sticky top-0 z-10 bg-white border-b">
        <div class="px-4 py-4 flex items-center justify-between">
          <button type="button" onclick="history.back()" class="text-gray-600">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <h2 class="text-xl font-semibold text-gray-800">기업 프로필 수정</h2>
          <div class="w-6"></div>
        </div>
      </div>

      <!-- 수정 폼 -->
      <form
        method="POST"
        action="{{ url_for('auth.edit_company_profile') }}"
        class="px-6 py-8"
      >
        <!-- 기업명 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            기업명
          </label>
          <input
            type="text"
            name="name"
            value="{{ user.name }}"
            placeholder="기업명을 입력하세요"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <!-- 대표자명 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            대표자명
          </label>
          <input
            type="text"
            name="representative_name"
            value="{{ user.representative_name or '' }}"
            placeholder="대표자명을 입력하세요"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- 사업자등록번호 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            사업자등록번호
          </label>
          <input
            type="text"
            name="business_number"
            value="{{ user.business_number or '' }}"
            placeholder="000-00-00000"
            maxlength="12"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- 전화번호 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            전화번호
          </label>
          <input
            type="tel"
            name="phone"
            value="{{ user.phone }}"
            placeholder="02-0000-0000"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <!-- 이메일 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            이메일
          </label>
          <input
            type="email"
            name="email"
            value="{{ user.email }}"
            placeholder="company@example.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-100"
            readonly
          />
          <p class="text-xs text-gray-500 mt-1">이메일은 변경할 수 없습니다</p>
        </div>

        <!-- 회사 주소 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            회사 주소
          </label>
          <input
            type="text"
            name="address"
            value="{{ user.address or '' }}"
            placeholder="회사 주소를 입력하세요"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- 회사 소개 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            회사 소개
          </label>
          <textarea
            name="description"
            rows="4"
            placeholder="회사 소개를 입력하세요"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
          >
{{ user.description or '' }}</textarea
          >
        </div>

        <!-- 제출 버튼 -->
        <div class="mt-8">
          <button
            type="submit"
            class="w-full text-white font-semibold py-4 px-4 rounded-lg transition-colors"
            style="background-color: #023591"
          >
            정보 수정 완료
          </button>
        </div>
      </form>
    </div>
  </body>
</html>

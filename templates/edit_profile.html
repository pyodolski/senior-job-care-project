<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로필 수정 - 사람이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_key }}&libraries=services"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css') }}" />
  </head>
  <body class="bg-gray-100">
    <div class="w-full max-w-md mx-auto px-4 bg-white shadow-lg min-h-screen">
      <!-- 상단 헤더 -->
      <div class="pt-6 pb-4">
        <div class="flex items-center justify-between mb-4">
          <button type="button" onclick="goBack()" class="text-gray-600">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <h2 class="text-xl font-semibold text-gray-800">프로필 수정</h2>
          <div class="w-6"></div>
        </div>
      </div>

      <!-- 수정 폼 -->
      <form
        method="POST"
        action="{{ url_for('auth.edit_profile') }}"
        id="edit-form"
        class="px-4 py-8"
      >
        <!-- Hidden inputs for form data -->
        <input type="hidden" name="sido" id="final-sido" />
        <input type="hidden" name="sigungu" id="final-sigungu" />
        <input type="hidden" name="dong" id="final-dong" />

        <!-- 이름 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            이름
          </label>
          <input
            type="text"
            name="name"
            id="name"
            value="{{ user.name }}"
            placeholder="이름을 입력하세요"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <!-- 닉네임 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            닉네임
          </label>
          <input
            type="text"
            name="nickname"
            id="nickname"
            value="{{ user.nickname }}"
            placeholder="닉네임을 입력하세요"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <!-- 전화번호 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            전화번호
          </label>
          <input
            type="tel"
            name="phone"
            id="phone"
            value="{{ user.phone }}"
            placeholder="010-0000-0000"
            maxlength="13"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <!-- 생년월일 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            생년월일
          </label>
          <input
            type="date"
            name="birth_date"
            id="birth_date"
            value="{{ user.birth_date }}"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- 거주지 -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            거주지
          </label>
          <div class="relative">
            <input
              type="text"
              id="address-search"
              placeholder="찾아보기"
              readonly
              onclick="openMapModal()"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10 cursor-pointer bg-white"
            />
            <svg
              class="w-5 h-5 absolute right-3 top-3.5 text-gray-400 pointer-events-none"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </div>
          <div id="address-display" class="mt-3 text-sm text-gray-600">
            <p id="full-address" class="font-medium">
              {% if user.sido and user.sigungu and user.dong %}
                {{ user.sido }} {{ user.sigungu }} {{ user.dong }}
              {% endif %}
            </p>
          </div>
          <!-- Hidden inputs to store actual values -->
          <input type="hidden" id="sido" value="{{ user.sido }}" />
          <input type="hidden" id="sigungu" value="{{ user.sigungu }}" />
          <input type="hidden" id="dong" value="{{ user.dong }}" />
        </div>

        <!-- 제출 버튼 -->
        <div class="mt-8">
          <button
            type="submit"
            class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-4 px-4 rounded-lg transition-colors"
          >
            정보 수정 완료
          </button>
        </div>
      </form>
    </div>

    <!-- 지도 모달 -->
    <div
      id="map-modal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center"
    >
      <div
        class="bg-white rounded-lg overflow-hidden"
        style="width: 80%; max-width: 400px; height: 45vh"
      >
        <!-- 모달 헤더 -->
        <div class="p-4 border-b flex items-center justify-between">
          <h3 class="text-lg font-semibold text-gray-800">거주지 선택</h3>
          <button
            type="button"
            onclick="closeMapModal()"
            class="text-gray-500 hover:text-gray-700"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- 지도 영역 -->
        <div id="map" style="width: 100%; height: calc(100% - 180px)"></div>

        <!-- 주소 표시 및 확인 버튼 -->
        <div class="p-4 border-t">
          <p id="selected-address" class="text-sm text-gray-600 mb-3">
            지도를 클릭하여 위치를 선택해주세요
          </p>
          <button
            type="button"
            id="confirm-location-btn"
            onclick="confirmLocation()"
            class="w-full bg-gray-300 text-gray-500 font-medium py-3 px-4 rounded-lg transition-colors"
            disabled
          >
            확인
          </button>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      // Flask 템플릿 변수를 JavaScript로 전달
      window.authProfileUrl = "{{ url_for('auth.profile') }}";
    </script>
    <script src="{{ url_for('static', filename='js/edit_profile.js') }}"></script>
  </body>
</html>

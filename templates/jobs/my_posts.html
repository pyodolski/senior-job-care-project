<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내가 올린 글 - 사람이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div class="max-w-md mx-auto bg-gray-50 min-h-screen flex flex-col">
      <!-- 상단 고정 영역 -->
      <div class="sticky top-0 z-10 bg-white">
        <!-- 상단 바 -->
        <header class="px-4 py-4 flex items-center">
          <a href="{{ url_for('auth.profile') }}" class="mr-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-6 h-6 text-gray-700"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </a>
          <h1 class="text-lg font-bold text-gray-800">내가 올린 글</h1>
        </header>
      </div>

      <!-- 메인 컨텐츠 -->
      <main class="flex-grow px-4 py-4 pb-24">
        <!-- 검색 바 -->
        <div class="mb-4">
          <div class="relative">
            <input
              type="text"
              id="searchInput"
              placeholder="제목으로 검색하세요"
              class="w-full px-4 py-3 pl-10 bg-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            />
            <svg
              class="w-5 h-5 absolute left-3 top-3.5 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </div>
        </div>

        <!-- 총 게시글 수 -->
        <div class="text-sm text-gray-600 font-medium mb-4">
          총 {{ total_count }}건
        </div>

        <!-- 내가 올린 글 리스트 -->
        {% if jobs %} {% for job in jobs %}
        <div
          class="bg-white rounded-xl p-5 mb-3 shadow-sm border border-gray-100"
          data-job-id="{{ job.id }}"
        >
          <!-- 상단: 채용 상태 아이콘 -->
          <div class="flex items-start justify-start mb-3">
            <span
              class="inline-flex items-center justify-center w-14 h-6 bg-gray-100 text-gray-600 text-xs font-medium rounded-full"
            >
              채용중
            </span>
          </div>

          <!-- 제목 -->
          <h3 class="text-lg font-bold text-gray-900 mb-2">{{ job.title }}</h3>

          <!-- 급여 -->
          <p class="text-blue-900 font-bold text-base mb-3">
            {% if job.salary %}{{ job.salary }}{% else %}급여 협의{% endif %}
          </p>

          <!-- 위치 및 작성일 -->
          <div class="flex items-center text-sm text-gray-600 mb-4">
            <svg
              class="w-4 h-4 mr-1"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span>{{ job.time_ago }} | {{ job.category or '시간알이' }}</span>
          </div>

          <!-- 하단 버튼들 -->
          <div class="flex items-center justify-between pt-3 border-t">
            <button
              onclick="event.stopPropagation(); deletePost({{ job.id }})"
              class="text-sm text-gray-500 hover:text-gray-700 font-medium"
            >
              삭제
            </button>
            <button
              onclick="event.stopPropagation(); editPost({{ job.id }})"
              class="text-sm text-blue-900 hover:text-blue-800 font-semibold"
            >
              수정하기
            </button>
          </div>
        </div>
        {% endfor %} {% else %}
        <!-- 작성한 글 없을 때 -->
        <div class="text-center py-16">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-16 h-16 mx-auto text-gray-300 mb-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <p class="text-gray-500 mb-2">작성한 글이 없습니다</p>
          <p class="text-sm text-gray-400 mb-4">첫 번째 공고를 작성해보세요!</p>
          <a
            href="{{ url_for('company.create_company_job') }}"
            class="inline-block bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2 px-6 rounded-xl transition-colors"
          >
            공고 작성하기
          </a>
        </div>
        {% endif %}
      </main>

      <!-- 하단 네비게이션 -->
      <footer
        class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around"
      >
        <a
          href="{{ url_for('map.show_map') }}"
          class="flex-1 flex flex-col items-center justify-center p-2 text-gray-500"
        >
          <div class="w-6 h-6 mb-1 flex items-center justify-center">
            <img
              src="{{ url_for('static', filename='images/footer/map.png') }}"
              alt="지도"
              class="max-w-full max-h-full object-contain"
            />
          </div>
          <span class="text-xs">지도</span>
        </a>
        <a
          href="{{ url_for('jobs.bookmark_list') }}"
          class="flex-1 flex flex-col items-center justify-center p-2 text-gray-500"
        >
          <div class="w-6 h-6 mb-1 flex items-center justify-center">
            <img
              src="{{ url_for('static', filename='images/footer/favorite.png') }}"
              alt="찜"
              class="max-w-full max-h-full object-contain"
            />
          </div>
          <span class="text-xs">찜</span>
        </a>
        <a
          href="{{ url_for('auth.main') }}"
          class="flex-1 flex flex-col items-center justify-center p-2 text-gray-500"
        >
          <div class="w-6 h-6 mb-1 flex items-center justify-center">
            <img
              src="{{ url_for('static', filename='images/footer/home.png') }}"
              alt="홈"
              class="max-w-full max-h-full object-contain"
            />
          </div>
          <span class="text-xs">홈</span>
        </a>
        <a
          href="{{ url_for('chat.chat_list') }}"
          class="flex-1 flex flex-col items-center justify-center p-2 text-gray-500"
        >
          <div class="w-6 h-6 mb-1 flex items-center justify-center">
            <img
              src="{{ url_for('static', filename='images/footer/chatting.png') }}"
              alt="채팅"
              class="max-w-full max-h-full object-contain"
            />
          </div>
          <span class="text-xs">채팅</span>
        </a>
        <a
          href="{{ url_for('auth.profile') }}"
          class="flex-1 flex flex-col items-center justify-center p-2 text-gray-500"
        >
          <div class="w-6 h-6 mb-1 flex items-center justify-center">
            <img
              src="{{ url_for('static', filename='images/footer/profile.png') }}"
              alt="내정보"
              class="max-w-full max-h-full object-contain"
            />
          </div>
          <span class="text-xs">내정보</span>
        </a>
      </footer>
    </div>

    <script>
      // 공고 수정
      function editPost(jobId) {
        window.location.href = `/jobs/${jobId}/edit`;
      }

      // 공고 삭제
      async function deletePost(jobId) {
        if (
          !confirm(
            "정말로 이 글을 삭제하시겠습니까?\n삭제된 글은 복구할 수 없습니다."
          )
        ) {
          return;
        }

        try {
          const response = await fetch(`/jobs/${jobId}/delete`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
          });

          const data = await response.json();

          if (data.success) {
            alert("글이 삭제되었습니다.");
            const cardToRemove = document.querySelector(
              `[data-job-id="${jobId}"]`
            );
            if (cardToRemove) {
              cardToRemove.remove();
            } else {
              location.reload();
            }
          } else {
            alert(data.message || "글 삭제 중 오류가 발생했습니다.");
          }
        } catch (error) {
          console.error("Error:", error);
          alert("글 삭제 중 오류가 발생했습니다.");
        }
      }

      // 검색 기능
      document
        .getElementById("searchInput")
        ?.addEventListener("input", function (e) {
          const searchTerm = e.target.value.toLowerCase();
          const jobCards = document.querySelectorAll("[data-job-id]");

          jobCards.forEach((card) => {
            const title = card.querySelector("h3").textContent.toLowerCase();
            if (title.includes(searchTerm)) {
              card.style.display = "block";
            } else {
              card.style.display = "none";
            }
          });
        });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공고 수정 - 사람이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_key }}&libraries=services"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/edit_job.css') }}"
    />
  </head>
  <body class="bg-gray-50">
    <div class="w-full bg-white shadow-lg min-h-screen">
      <!-- 상단 헤더 -->
      <header class="bg-white border-b px-4 py-4 sticky top-0 z-10">
        <div class="flex items-center justify-between">
          <button onclick="history.back()" class="text-gray-600">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <h1 class="text-lg font-bold text-gray-800">이력서 작성</h1>
          <div class="w-6"></div>
          <!-- 공간 확보용 -->
        </div>
      </header>

      <!-- 서브 헤더 -->
      <div class="bg-white px-4 py-3 border-b">
        <h2 class="text-base font-medium text-gray-700 text-center">
          나의 희망 직무분야를 선택해주세요
        </h2>
      </div>

      <!-- 메인 컨텐츠 -->
      <main class="px-4 py-6 pb-24">
        <form id="jobForm" method="POST" class="space-y-6">
          <!-- 제목 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              제목 <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="title"
              id="title"
              value="{{ job.title }}"
              class="w-full px-4 py-4 text-lg border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none"
              placeholder="공고 제목을 입력하세요"
              required
            />
          </div>

          <!-- 담당자명 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              담당자명 <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="company"
              id="company"
              value="{{ job.company }}"
              class="w-full px-4 py-4 text-lg border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none"
              placeholder="담당자명을 입력하세요"
              required
            />
          </div>

          <!-- 모집 형태 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3">
              모집 형태 <span class="text-red-500">*</span>
            </label>
            <div class="grid grid-cols-2 gap-3">
              <button
                type="button"
                class="btn-option px-4 py-3 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.recruitment_type == '정규직' %}active{% endif %}"
                data-value="정규직"
                onclick="selectRecruitmentType(this, '정규직')"
              >
                정규직
              </button>
              <button
                type="button"
                class="btn-option px-4 py-3 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.recruitment_type == '일용직' %}active{% endif %}"
                data-value="일용직"
                onclick="selectRecruitmentType(this, '일용직')"
              >
                일용직
              </button>
            </div>
            <input
              type="hidden"
              name="recruitment_type"
              id="recruitment_type"
              value="{{ job.recruitment_type }}"
              required
            />
          </div>

          <!-- 근무 기간 (일용직 선택 시만 표시) -->
          <div
            id="work_period_group"
            {%
            if
            job.recruitment_type
            !="일용직"
            %}style="display: none"
            {%
            endif
            %}
          >
            <label class="block text-sm font-semibold text-gray-700 mb-3">
              근무 기간 <span class="text-red-500">*</span>
            </label>
            <div class="grid grid-cols-3 gap-3">
              <button
                type="button"
                class="btn-option px-4 py-3 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_period == '1개월 이상' %}active{% endif %}"
                data-value="1개월 이상"
                onclick="selectWorkPeriod(this, '1개월 이상')"
              >
                1개월 이상
              </button>
              <button
                type="button"
                class="btn-option px-4 py-3 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_period == '3개월 이상' %}active{% endif %}"
                data-value="3개월 이상"
                onclick="selectWorkPeriod(this, '3개월 이상')"
              >
                3개월 이상
              </button>
              <button
                type="button"
                class="btn-option px-4 py-3 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_period == '6개월 이상' %}active{% endif %}"
                data-value="6개월 이상"
                onclick="selectWorkPeriod(this, '6개월 이상')"
              >
                6개월 이상
              </button>
            </div>
            <input
              type="hidden"
              name="work_period"
              id="work_period"
              value="{{ job.work_period or '' }}"
            />
          </div>

          <!-- 근무 기간 날짜 선택 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3">
              근무 기간 날짜 (선택사항)
            </label>
            <div class="flex gap-3">
              <input
                type="date"
                name="recruitment_start_date"
                id="recruitment_start_date"
                value="{% if job.recruitment_start_date %}{{ job.recruitment_start_date.strftime('%Y-%m-%d') }}{% endif %}"
                class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none text-gray-700"
                placeholder="시작일"
              />
              <input
                type="date"
                name="recruitment_end_date"
                id="recruitment_end_date"
                value="{% if job.recruitment_end_date %}{{ job.recruitment_end_date.strftime('%Y-%m-%d') }}{% endif %}"
                class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none text-gray-700"
                placeholder="종료일"
              />
            </div>
            <p class="text-sm text-gray-500 mt-2">시작일과 종료일을 선택해주세요</p>
          </div>

          <!-- 근무 요일 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3">
              근무 요일
            </label>
            <div class="flex gap-2">
              <button
                type="button"
                class="day-btn w-12 h-12 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_monday %}option-selected{% endif %}"
                data-day="monday"
                onclick="toggleDay(this)"
              >
                월
              </button>
              <button
                type="button"
                class="day-btn w-12 h-12 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_tuesday %}option-selected{% endif %}"
                data-day="tuesday"
                onclick="toggleDay(this)"
              >
                화
              </button>
              <button
                type="button"
                class="day-btn w-12 h-12 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_wednesday %}option-selected{% endif %}"
                data-day="wednesday"
                onclick="toggleDay(this)"
              >
                수
              </button>
              <button
                type="button"
                class="day-btn w-12 h-12 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_thursday %}option-selected{% endif %}"
                data-day="thursday"
                onclick="toggleDay(this)"
              >
                목
              </button>
              <button
                type="button"
                class="day-btn w-12 h-12 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_friday %}option-selected{% endif %}"
                data-day="friday"
                onclick="toggleDay(this)"
              >
                금
              </button>
              <button
                type="button"
                class="day-btn w-12 h-12 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_saturday %}option-selected{% endif %}"
                data-day="saturday"
                onclick="toggleDay(this)"
              >
                토
              </button>
              <button
                type="button"
                class="day-btn w-12 h-12 rounded-full border-2 border-gray-300 text-gray-700 text-sm font-medium {% if job.work_sunday %}option-selected{% endif %}"
                data-day="sunday"
                onclick="toggleDay(this)"
              >
                일
              </button>
            </div>
            <input
              type="hidden"
              name="work_monday"
              id="work_monday"
              value="{% if job.work_monday %}true{% else %}false{% endif %}"
            />
            <input
              type="hidden"
              name="work_tuesday"
              id="work_tuesday"
              value="{% if job.work_tuesday %}true{% else %}false{% endif %}"
            />
            <input
              type="hidden"
              name="work_wednesday"
              id="work_wednesday"
              value="{% if job.work_wednesday %}true{% else %}false{% endif %}"
            />
            <input
              type="hidden"
              name="work_thursday"
              id="work_thursday"
              value="{% if job.work_thursday %}true{% else %}false{% endif %}"
            />
            <input
              type="hidden"
              name="work_friday"
              id="work_friday"
              value="{% if job.work_friday %}true{% else %}false{% endif %}"
            />
            <input
              type="hidden"
              name="work_saturday"
              id="work_saturday"
              value="{% if job.work_saturday %}true{% else %}false{% endif %}"
            />
            <input
              type="hidden"
              name="work_sunday"
              id="work_sunday"
              value="{% if job.work_sunday %}true{% else %}false{% endif %}"
            />
          </div>

          <!-- 근무 시간 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-3">
              근무 시간
            </label>
            <div class="flex gap-3 items-center">
              <input
                type="time"
                name="work_start_time"
                value="{{ job.work_start_time.strftime('%H:%M') if job.work_start_time else '' }}"
                class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none"
              />
              <span class="text-gray-500">~</span>
              <input
                type="time"
                name="work_end_time"
                value="{{ job.work_end_time.strftime('%H:%M') if job.work_end_time else '' }}"
                class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none"
              />
            </div>
          </div>

          <!-- 급여 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              급여
            </label>
            <input
              type="text"
              name="salary"
              id="salary"
              value="{{ job.salary or '' }}"
              class="w-full px-4 py-4 text-lg border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none"
              placeholder="예: 시급 10,000원"
            />
          </div>

          <!-- 근무 지역 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              근무 지역 <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <input
                type="text"
                name="region"
                id="region"
                readonly
                value="{{ job.region }}"
                onclick="openAddressModal()"
                class="w-full px-4 py-4 text-lg border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none pr-12 cursor-pointer"
                placeholder="지도에서 위치를 선택해주세요"
                required
              />
              <button
                type="button"
                onclick="openAddressModal()"
                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-blue-600"
              >
                <svg
                  class="w-6 h-6"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                </svg>
              </button>
            </div>

            <!-- 숨은 필드 -->
            <input
              type="hidden"
              id="latitude"
              name="latitude"
              value="{{ job.latitude or '' }}"
            />
            <input
              type="hidden"
              id="longitude"
              name="longitude"
              value="{{ job.longitude or '' }}"
            />
            <input
              type="hidden"
              id="region_1depth_name"
              name="region_1depth_name"
              value="{{ job.region_1depth_name or '' }}"
            />
            <input
              type="hidden"
              id="region_2depth_name"
              name="region_2depth_name"
              value="{{ job.region_2depth_name or '' }}"
            />
            <input
              type="hidden"
              id="region_3depth_name"
              name="region_3depth_name"
              value="{{ job.region_3depth_name or '' }}"
            />
          </div>

          <!-- 모집 인원 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              모집 인원
            </label>
            <input
              type="number"
              name="recruitment_count"
              id="recruitment_count"
              value="{{ job.recruitment_count or '' }}"
              class="w-full px-4 py-4 text-lg border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none"
              placeholder="모집 인원 수"
              min="1"
            />
          </div>

          <!-- 연락처 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              연락처
            </label>
            <input
              type="tel"
              name="contact_phone"
              id="contact_phone"
              value="{{ job.contact_phone or '' }}"
              class="w-full px-4 py-4 text-lg border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none"
              placeholder="010-0000-0000"
              maxlength="13"
            />
          </div>

          <!-- 상세 설명 -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-sm font-semibold text-gray-700">
                상세 설명 <span class="text-red-500">*</span>
              </label>
              <button
                type="button"
                onclick="openAIAssistant()"
                class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1"
              >
                <span>✨</span>
                <span>AI로 작성하기</span>
              </button>
            </div>
            <textarea
              name="description"
              id="description"
              rows="8"
              class="w-full px-4 py-4 text-base border-2 border-gray-200 rounded-2xl focus:border-blue-500 focus:outline-none resize-none"
              placeholder="업무 내용, 자격 요건 등을 자세히 작성해주세요"
              required
            >
{{ job.description }}</textarea
            >
          </div>
        </form>
      </main>

      <!-- 하단 고정 푸터 -->
      <footer
        class="fixed bottom-0 left-0 right-0 w-full bg-white border-t px-4 py-4"
      >
        <button
          type="submit"
          form="jobForm"
          class="w-full py-4 px-4 bg-blue-900 hover:bg-blue-800 text-white font-semibold rounded-2xl transition-colors"
        >
          다음
        </button>
      </footer>
    </div>

    <!-- AI 어시스턴트 모달 -->
    <div
      id="aiModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col"
      >
        <!-- 헤더 -->
        <div class="p-4 border-b flex items-center justify-between">
          <h3 class="text-lg font-bold flex items-center gap-2">
            <span>✨</span>
            <span>AI 작성 도우미</span>
          </h3>
          <button
            onclick="closeAIModal()"
            class="text-gray-400 hover:text-gray-600"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- 콘텐츠 -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
          <div>
            <p class="text-sm text-gray-600 mb-2">
              아래 정보를 바탕으로 AI가 상세 설명을 작성해드립니다.
            </p>
          </div>

          <!-- 제목 입력 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              공고 제목
            </label>
            <input
              type="text"
              id="aiTitle"
              placeholder="제목을 입력해주세요"
              class="w-full px-4 py-3 text-sm border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
            />
          </div>

          <!-- 급여 입력 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              급여 정보
            </label>
            <input
              type="text"
              id="aiSalary"
              placeholder="예: 시급 15,000원"
              class="w-full px-4 py-3 text-sm border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
            />
          </div>

          <!-- 직무 내용 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              직무 내용
            </label>
            <textarea
              id="aiJobContent"
              placeholder="주요 업무 내용을 입력해주세요"
              rows="3"
              class="w-full px-4 py-3 text-sm border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none resize-none"
            ></textarea>
          </div>

          <!-- 요구사항 -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              요구사항 (선택)
            </label>
            <textarea
              id="aiRequirements"
              placeholder="필요한 자격이나 경력 등을 입력해주세요"
              rows="2"
              class="w-full px-4 py-3 text-sm border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none resize-none"
            ></textarea>
          </div>

          <!-- 생성된 텍스트 미리보기 -->
          <div id="aiPreview" class="hidden">
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              생성된 내용 미리보기
            </label>
            <div
              id="aiPreviewContent"
              class="bg-gray-50 rounded-xl p-4 text-sm text-gray-700 border border-gray-200 max-h-48 overflow-y-auto"
            ></div>
          </div>

          <!-- 로딩 표시 -->
          <div id="aiLoading" class="hidden text-center">
            <p class="text-sm text-gray-600">AI가 작성 중입니다...</p>
            <div class="mt-2 flex justify-center gap-1">
              <div
                class="w-2 h-2 bg-blue-600 rounded-full animate-bounce"
              ></div>
              <div
                class="w-2 h-2 bg-blue-600 rounded-full animate-bounce"
                style="animation-delay: 0.2s"
              ></div>
              <div
                class="w-2 h-2 bg-blue-600 rounded-full animate-bounce"
                style="animation-delay: 0.4s"
              ></div>
            </div>
          </div>
        </div>

        <!-- 버튼 -->
        <div class="p-4 border-t flex gap-2">
          <button
            type="button"
            onclick="generateWithAI()"
            class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors"
          >
            작성하기
          </button>
          <button
            type="button"
            id="aiApplyBtn"
            onclick="applyAIText()"
            class="flex-1 py-3 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl transition-colors hidden"
          >
            적용하기
          </button>
          <button
            type="button"
            onclick="closeAIModal()"
            class="flex-1 py-3 px-4 border-2 border-gray-300 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition-colors"
          >
            취소
          </button>
        </div>
      </div>
    </div>

    <!-- 주소 검색 모달 -->
    <div
      id="addressModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col"
      >
        <!-- 헤더 -->
        <div class="p-4 border-b">
          <h3 class="text-lg font-bold">주소 검색</h3>
        </div>

        <!-- 검색 입력 -->
        <div class="p-4 border-b">
          <div class="flex gap-2">
            <input
              type="text"
              id="addressSearchKeyword"
              placeholder="주소를 입력하세요 (예: 경산시 조영동)"
              class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none"
              onkeypress="if(event.key === 'Enter') searchAddress()"
            />
            <button
              onclick="searchAddress()"
              class="px-4 py-3 bg-blue-600 text-white rounded-xl font-medium"
            >
              검색
            </button>
          </div>
        </div>

        <!-- 지도 영역 -->
        <div class="flex-1 overflow-hidden">
          <div id="addressMap" class="w-full h-80"></div>
        </div>

        <!-- 선택된 주소 표시 -->
        <div class="p-4 border-t">
          <p class="text-sm text-gray-600 mb-2">선택된 주소</p>
          <p
            id="selectedAddressText"
            class="text-base font-medium text-gray-900 mb-4"
          >
            지도에서 위치를 클릭하거나 검색해주세요
          </p>
          <div class="flex gap-2">
            <button
              onclick="closeAddressModal()"
              class="flex-1 px-4 py-3 border-2 border-gray-300 rounded-xl text-gray-700 font-medium"
            >
              취소
            </button>
            <button
              id="confirmAddressBtn"
              onclick="selectAddress()"
              class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium disabled:bg-gray-300 disabled:cursor-not-allowed"
              disabled
            >
              선택
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/edit_job.js') }}"></script>
  </body>
</html>

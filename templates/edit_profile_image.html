<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프로필 사진 수정 - 사람이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/edit_profile_image.css') }}"
    />
  </head>
  <body>
    <div class="max-w-md mx-auto bg-white shadow-lg min-h-screen p-6">
      <!-- 헤더 with 뒤로가기 버튼 -->
      <div class="flex items-center justify-between mb-20">
        <a
          href="{{ url_for('auth.profile') }}"
          class="text-gray-600 hover:text-gray-800"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </a>
        <h2 class="text-xl font-bold text-gray-900">프로필 사진 수정</h2>
        <div class="w-6"></div>
      </div>

      <!-- 현재 프로필 이미지 -->
      <div class="flex justify-center mb-6">
        {% if profile_url %}
        <img
          src="{{ profile_url }}"
          alt="profile"
          class="w-32 h-32 rounded-full object-cover border-4 border-gray-200"
        />
        {% else %}
        <div
          class="w-32 h-32 rounded-full bg-gray-200 border-4 border-gray-300 flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-16 h-16 text-gray-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </div>
        {% endif %}
      </div>

      <form
        method="POST"
        action="{{ url_for('auth.edit_profile_image') }}"
        enctype="multipart/form-data"
      >
        <div class="mb-6">
          <label class="block mb-2 font-semibold text-gray-700"
            >새 프로필 사진 선택</label
          >
          <input
            type="file"
            name="profile_image"
            accept="image/*"
            id="profileImageInput"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
          <p class="text-sm text-gray-500 mt-2">
            JPG, PNG 형식의 이미지를 업로드할 수 있습니다.
          </p>
        </div>

        <!-- 미리보기 -->
        <div id="imagePreview" class="mb-6 hidden">
          <label class="block mb-2 font-semibold text-gray-700">미리보기</label>
          <div class="flex justify-center">
            <img
              id="previewImg"
              src=""
              alt="preview"
              class="w-32 h-32 rounded-full object-cover border-4 border-blue-200"
            />
          </div>
        </div>

        <!-- 버튼들을 같은 행에 배치 -->
        <div class="flex gap-3">
          <button
            type="submit"
            class="flex-1 bg-blue-900 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition-colors"
          >
            프로필 사진 변경
          </button>
          {% if profile_url %}
          <button
            type="button"
            onclick="deleteProfileImage()"
            class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition-colors"
          >
            프로필 사진 삭제
          </button>
          {% endif %}
        </div>
      </form>
    </div>

    <script src="{{ url_for('static', filename='js/edit_profile_image.js') }}"></script>
    <script>
      function deleteProfileImage() {
        if (
          confirm("현재 프로필 사진을 삭제하고 기본 이미지로 되돌리시겠습니까?")
        ) {
          const form = document.createElement("form");
          form.method = "POST";
          form.action = "{{ url_for('auth.delete_profile_image') }}";
          document.body.appendChild(form);
          form.submit();
        }
      }
    </script>
  </body>
</html>

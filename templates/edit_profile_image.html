<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프로필 사진 수정 - 사람이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <div class="max-w-md mx-auto bg-white mt-8 shadow rounded-lg p-6">
      <h2 class="text-2xl font-bold mb-6 text-gray-900">프로필 사진 수정</h2>

      <!-- 현재 프로필 이미지 -->
      <div class="flex justify-center mb-6">
        {% if profile_url %}
        <img
          src="{{ profile_url }}"
          alt="profile"
          class="w-32 h-32 rounded-full object-cover border-4 border-gray-200"
        />
        {% else %}
        <div
          class="w-32 h-32 rounded-full bg-gray-200 border-4 border-gray-300 flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-16 h-16 text-gray-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
        </div>
        {% endif %}
      </div>

      <form
        method="POST"
        action="{{ url_for('auth.edit_profile_image') }}"
        enctype="multipart/form-data"
      >
        <div class="mb-6">
          <label class="block mb-2 font-semibold text-gray-700"
            >새 프로필 사진 선택</label
          >
          <input
            type="file"
            name="profile_image"
            accept="image/*"
            id="profileImageInput"
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
          <p class="text-sm text-gray-500 mt-2">
            JPG, PNG 형식의 이미지를 업로드할 수 있습니다.
          </p>
        </div>

        <!-- 미리보기 -->
        <div id="imagePreview" class="mb-6 hidden">
          <label class="block mb-2 font-semibold text-gray-700">미리보기</label>
          <div class="flex justify-center">
            <img
              id="previewImg"
              src=""
              alt="preview"
              class="w-32 h-32 rounded-full object-cover border-4 border-blue-200"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-3 rounded-lg transition-colors"
        >
          프로필 사진 변경
        </button>
        <a
          href="{{ url_for('auth.profile') }}"
          class="block mt-4 text-blue-900 text-center font-semibold hover:underline"
        >
          ← 프로필로 돌아가기
        </a>
      </form>
    </div>

    <script>
      // 이미지 미리보기 기능
      document
        .getElementById("profileImageInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              document.getElementById("previewImg").src = e.target.result;
              document
                .getElementById("imagePreview")
                .classList.remove("hidden");
            };
            reader.readAsDataURL(file);
          }
        });
    </script>
  </body>
</html>

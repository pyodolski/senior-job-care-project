<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>소셜 로그인 - 사람이음</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}" />
  </head>
  <body class="bg-white">
    <div
      class="w-full max-w-md mx-auto px-8 bg-white min-h-screen flex flex-col items-center justify-center"
    >
      <div class="text-center mb-12 w-full">
        <div class="flex items-center justify-center mb-5">
          <div class="w-24 h-24 flex items-center justify-center">
            <img
              src="{{ url_for('static', filename='images/header/logo.png') }}"
              alt="로고"
              class="max-w-full max-h-full object-contain"
            />
          </div>
        </div>
        <span class="font-lotteria text-4xl font-regular text-blue-800"
          >이음</span
        >
      </div>

      <div class="space-y-4 w-full">
        <a
          href="{{ url_for('kakao.login') }}"
          class="w-full bg-[#FEE500] hover:bg-yellow-500 text-black font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center relative"
        >
          <img
            src="{{ url_for('static', filename='images/login/kakao_login.png') }}"
            alt="카카오"
            class="w-6 h-6 absolute left-4"
          />
          <span>카카오톡 계정으로 로그인</span>
        </a>

        <a
          href="{{ url_for('naver.naver_login') }}"
          class="w-full bg-[#03C75A] hover:bg-green-600 text-white font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center relative"
        >
          <img
            src="{{ url_for('static', filename='images/login/naver_login.png') }}"
            alt="네이버"
            class="w-6 h-6 absolute left-4"
          />
          <span>네이버 계정으로 로그인</span>
        </a>

        <a
          href="{{ url_for('google.login') }}"
          class="w-full text-gray-800 font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center border border-gray-300 relative"
          style="background-color: #f4f4f4"
          onmouseover="this.style.backgroundColor='#E0E0E0'"
          onmouseout="this.style.backgroundColor='#F4F4F4'"
        >
          <img
            src="{{ url_for('static', filename='images/login/google_login.png') }}"
            alt="구글"
            class="w-6 h-6 absolute left-4"
          />
          <span>구글 계정으로 로그인</span>
        </a>

        <a
          href="{{ url_for('auth.login') }}"
          class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 px-4 rounded-xl transition-colors flex items-center justify-center relative"
        >
          <img
            src="{{ url_for('static', filename='images/login/login.png') }}"
            alt="로그인"
            class="w-6 h-6 absolute left-4"
          />
          <span>일반 로그인</span>
        </a>
      </div>
    </div>
  </body>
</html>

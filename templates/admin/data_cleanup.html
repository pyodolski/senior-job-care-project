<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>데이터 정리 - 관리자</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <div class="max-w-4xl mx-auto p-6">
      <div class="bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-6 text-red-700">🧹 데이터 정리 관리</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="p-4 mb-4 rounded-lg text-sm {% if category == 'success' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="mb-6 p-4 border border-red-300 rounded-lg bg-red-50">
          <h2 class="text-xl font-bold mb-2 text-red-700">🗑️ 만료된 공고 즉시 삭제</h2>
          <p class="text-gray-600 mb-4">
            모집 마감일이 지난 모든 공고를 영구 삭제합니다.
          </p>

          <form
              action="{{ url_for('data_cleanup.delete_expired_jobs_manual') }}"
              method="POST"
              onsubmit="return confirm('경고: 만료된 모든 공고를 즉시 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.');"
          >
              <button
                  type="submit"
                  class="w-full bg-red-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-red-700 transition duration-300"
              >
                  ❌ 삭제 작업 실행
              </button>
          </form>
        </div>

        <div class="mt-6">
          <a
            href="{{ url_for('auth.home') }}"
            class="text-blue-600 hover:underline"
          >
            ← 메인으로 돌아가기
          </a>
        </div>
      </div>
    </div>
  </body>
</html>

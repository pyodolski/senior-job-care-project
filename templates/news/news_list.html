<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이음 뉴스 - 최근 시니어 일자리 뉴스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/news/news_list.css') }}" />
  </head>
  <body class="bg-gray-50">
    <div class="w-full bg-white shadow-lg min-h-screen">
      <!-- 상단 헤더 -->
      <header class="bg-white border-b px-4 py-4">
        <div class="flex items-center">
          <button onclick="history.back()" class="mr-4">
            <svg
              class="w-6 h-6 text-gray-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <h1 class="text-xl font-bold text-gray-800">뉴스</h1>
        </div>
      </header>

      <!-- 뉴스 목록 -->
      <main class="px-4 py-4 pb-24">
        <!-- 카테고리 탭 -->
        <div class="mb-6 overflow-x-auto">
          <div class="flex gap-2 min-w-max">
            <button
              onclick="changeCategory('시니어 정책')"
              class="category-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
              data-category="시니어 정책"
            >
              정책
            </button>
            <button
              onclick="changeCategory('시니어 채용')"
              class="category-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
              data-category="시니어 채용"
            >
              채용
            </button>
            <button
              onclick="changeCategory('시니어 교육')"
              class="category-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
              data-category="시니어 교육"
            >
              교육
            </button>
            <button
              onclick="changeCategory('시니어 사례')"
              class="category-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
              data-category="시니어 사례"
            >
              사례
            </button>
            <button
              onclick="changeCategory('시니어 복지')"
              class="category-btn px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
              data-category="시니어 복지"
            >
              복지
            </button>
          </div>
        </div>

        <div class="space-y-6">
          {% for news in news_list %}
          <article
            class="bg-white rounded-lg border border-gray-200 overflow-hidden cursor-pointer hover:shadow-md transition-shadow"
            onclick="window.open('{{ news.link }}', '_blank')"
          >
            <div class="p-4">
              <div class="flex gap-3 items-center">
                <div class="flex-1">
                  <h2
                    class="text-lg font-bold text-gray-900 mb-2 leading-tight"
                  >
                    {{ news.title }}
                  </h2>
                  <p class="text-sm text-gray-500 mb-3">{{ news.pub_date }}</p>
                  <div
                    class="flex items-center text-blue-600 text-sm font-medium"
                  >
                    <span>더 읽기</span>
                    <svg
                      class="w-4 h-4 ml-1"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                      />
                    </svg>
                  </div>
                </div>
                {% if news.image %}
                <div class="w-24 h-24 flex-shrink-0">
                  <img
                    src="{{ news.image }}"
                    alt="{{ news.title }}"
                    class="w-full h-full object-cover rounded-lg"
                    onerror="this.parentElement.innerHTML='<div class=\'w-full h-full bg-gray-200 rounded-lg flex items-center justify-center\'><svg class=\'w-8 h-8 text-gray-400\' fill=\'currentColor\' viewBox=\'0 0 20 20\'><path fill-rule=\'evenodd\' d=\'M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z\' clip-rule=\'evenodd\'/></svg></div>'"
                  />
                </div>
                {% else %}
                <div class="w-24 h-24 flex-shrink-0">
                  <div
                    class="w-full h-full bg-gray-200 rounded-lg flex items-center justify-center"
                  >
                    <svg
                      class="w-8 h-8 text-gray-400"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </div>
                </div>
                {% endif %}
              </div>
            </div>
          </article>
          {% endfor %} {% if not news_list %}
          <div class="text-center py-8">
            <div class="text-gray-400 mb-2">
              <svg
                class="w-12 h-12 mx-auto"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>
            <p class="text-gray-500">검색 결과가 없습니다.</p>
          </div>
          {% endif %}
        </div>

        <!-- 더 많은 뉴스 보기 -->
        <div class="text-center mt-8 py-6">
          <button
            onclick="loadMoreNews()"
            class="text-blue-600 font-medium flex items-center justify-center mx-auto hover:text-blue-700"
          >
            <span>더 많은 뉴스 보기</span>
            <svg
              class="w-4 h-4 ml-2"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>
        </div>
      </main>

      <!-- 하단 네비게이션 -->
      {% include 'components/footer.html' %}
    </div>
    <script>
      // Flask 템플릿 변수를 JavaScript로 전달
      window.initialQuery = "{{ query }}";
    </script>
    <script src="{{ url_for('static', filename='js/news/news_list.js') }}"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사람 이음 - 공개 이력서 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/resume/resume_list.css') }}"
    />
  </head>
  <body class="bg-gray-50">
    <div class="w-full bg-white shadow-lg min-h-screen">
      <!-- 상단 고정 영역 -->
      <div class="sticky top-0 z-10 bg-white shadow-sm">
        <!-- 상단 바 -->
        <header class="px-4 py-3 sm:px-6 flex justify-between items-center">
          <div class="flex items-center">
            <div class="w-8 h-8 mr-2 flex items-center justify-center">
              <img
                src="{{ url_for('static', filename='images/header/logo.png') }}"
                alt="로고"
                class="max-w-full max-h-full object-contain"
              />
            </div>
            <span class="text-xl font-bold text-blue-900">이음</span>
          </div>
          <div class="flex items-center space-x-3 sm:space-x-4">
            <div class="w-6 h-6 flex items-center justify-center">
              <img
                src="{{ url_for('static', filename='images/header/mic.png') }}"
                alt="마이크"
                class="max-w-full max-h-full object-contain"
              />
            </div>
            <div class="w-6 h-6 flex items-center justify-center">
              <img
                src="{{ url_for('static', filename='images/header/search.png') }}"
                alt="검색"
                class="max-w-full max-h-full object-contain"
              />
            </div>
          </div>
        </header>

        <!-- 네비게이션 탭 -->
        <nav class="flex border-b text-center">
          <a
            href="{{ url_for('jobs.job_list') }}"
            class="flex-1 py-3 text-gray-500 font-medium"
            >올린 모집 지원</a
          >
          <a
            href="{{ url_for('resumes.resume_list') }}"
            class="flex-1 py-3 border-b-4 border-blue-900 text-blue-900 font-bold"
            >이력서</a
          >
        </nav>
      </div>

      <!-- 메인 컨텐츠: 이력서 목록 -->
      <main class="px-4 py-4 sm:px-6 bg-gray-50 pb-24">
        <section class="mb-4 overflow-x-auto whitespace-nowrap hide-scroll">
            <div id="filter-container" class="inline-flex space-x-2">

                <div class="relative inline-block text-left">
                    <button type="button" onclick="toggleFilterDropdown(this)" data-filter="category"
                            class="inline-flex justify-center items-center w-full rounded-full border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        직무 분야 <svg class="ml-2 -mr-1 h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                    <div class="filter-dropdown absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-20 hidden" data-filter-target="category">
                        </div>
                </div>

                <div class="relative inline-block text-left">
                    <button type="button" onclick="toggleFilterDropdown(this)" data-filter="day"
                            class="inline-flex justify-center items-center w-full rounded-full border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        근무 요일 <svg class="ml-2 -mr-1 h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                    <div class="filter-dropdown absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-20 hidden" data-filter-target="day">
                        </div>
                </div>

                <div class="relative inline-block text-left">
                    <button type="button" onclick="toggleFilterDropdown(this)" data-filter="physical"
                            class="inline-flex justify-center items-center w-full rounded-full border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        신체 활동 <svg class="ml-2 -mr-1 h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                    <div class="filter-dropdown absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-20 hidden" data-filter-target="physical">
                        </div>
                </div>

                <div class="relative inline-block text-left">
                    <button type="button" onclick="toggleFilterDropdown(this)" data-filter="walkable"
                            class="inline-flex justify-center items-center w-full rounded-full border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        이동 거리 <svg class="ml-2 -mr-1 h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                    <div class="filter-dropdown absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-20 hidden" data-filter-target="walkable">
                        </div>
                </div>
            </div>
        </section>

        <div id="resume-container" class="space-y-4">
          {% if resumes %}
          <!-- 초기 이력서 목록 렌더링 -->
          {% include 'resume/_resume_cards.html' %} {% else %}
          <div class="text-center py-16">
            <svg
              class="mx-auto h-12 w-12 text-gray-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              aria-hidden="true"
            >
              <path
                vector-effect="non-scaling-stroke"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"
              />
            </svg>
            <h3 class="mt-2 text-sm font-medium text-gray-900">
              공개된 이력서가 없습니다
            </h3>
            <p class="mt-1 text-sm text-gray-500">
              아직 일자리를 찾는 시니어가 이력서를 공개하지 않았어요.
            </p>
          </div>
          {% endif %}
        </div>

        <!-- '더 보기' 버튼 -->
        {% if pagination.has_next %}
        <div class="mt-6 text-center">
          <button
            id="load-more-btn"
            class="bg-white text-gray-700 font-bold py-3 px-8 rounded-full shadow-md border border-gray-200 hover:bg-gray-100 transition-colors"
          >
            더 보기
          </button>
        </div>
        {% endif %}
      </main>

      <!-- 하단 네비게이션 -->
      {% include 'components/footer.html' %}
    </div>

    <script>
      // Flask 템플릿 변수를 JavaScript로 전달
      window.initialPage = {{ pagination.page }};
    </script>
    <script src="{{ url_for('static', filename='js/resume/resume_list.js') }}"></script>
  </body>
</html>
